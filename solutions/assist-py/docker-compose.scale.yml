# docker-compose.scale.yml
services:
  db:
    image: postgres:15
    container_name: ter-stepanyan-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ter-stepanyan-pgdata:/var/lib/postgresql/data
    networks:
      - ter-stepanyan-backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ter-stepanyan-redis
    networks:
      - ter-stepanyan-backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.optimized
    # container_name убран для масштабирования!
    ports:
      - "${APP_PORT}"  # порт внутри контейнера = ваш APP_PORT; хостовый порт Docker назначит случайно
    environment:
      APP_OWNER: ${APP_OWNER}
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      CACHE_TTL: ${CACHE_TTL}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ter-stepanyan-backend

volumes:
  ter-stepanyan-pgdata:

networks:
  ter-stepanyan-backend:
    driver: bridge